<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws:"
    />
    <title>Zenshape tabs</title>
    <link rel="stylesheet" href="./strip.css" />
  </head>
  <body>
    <div id="lights"></div>
    <button id="back" class="nav" title="Back (⌘[)" disabled>
      <svg viewBox="0 0 10 16" width="8" height="13" aria-hidden="true">
        <path
          d="M8 2L2 8l6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>
    </button>
    <button id="forward" class="nav" title="Forward (⌘])" disabled>
      <svg viewBox="0 0 10 16" width="8" height="13" aria-hidden="true">
        <path
          d="M2 2l6 6-6 6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        />
      </svg>
    </button>
    <div id="tabs"></div>
    <button id="new-tab" title="New Tab (⌘T)">+</button>
    <div id="drag-gap"></div>
    <button id="update" hidden></button>
    <button id="zen" title="Zen Mode (⌃⌘Z)">
      <svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true">
        <path
          fill="currentColor"
          fill-rule="evenodd"
          d="M0 0H100V100H0Z M0 30H57L0 62.91Z M100 70H43L100 37.09Z"
        />
      </svg>
    </button>
    <div id="drop-marker" hidden></div>
    <script type="module" src="./strip.ts"></script>
  </body>
</html>
